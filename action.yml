name: "Canoo Stats Cards"
description: "Generate static GitHub stats and contribution cards as SVG files, no hosted service"
author: "canoo"
branding:
  icon: "activity"
  color: "green"
inputs:
  username:
    description: "GitHub username to generate cards for. Defaults to the repository owner."
    required: false
    default: ""
  output_dir:
    description: "Directory in the calling repo to write the cards to."
    required: false
    default: "stats"
  cards:
    description: "Comma-separated card types to generate: stats,top-langs,tetris,contrib-3d,snake,streak,summary. Defaults to stats,top-langs for backwards compatibility with v1.0.0."
    required: false
    default: "stats,top-langs"
  github_token:
    description: "GitHub token for API calls. Pass secrets.GITHUB_TOKEN in the calling workflow."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Generate stats cards
      shell: bash
      env:
        GITHUB_USER: ${{ inputs.username }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        STATS_OUT: ${{ inputs.output_dir }}
        CARDS: ${{ inputs.cards }}
      run: python3 "${{ github.action_path }}/generate_stats.py"
    - name: Generate contribution cards
      shell: bash
      env:
        GITHUB_USER: ${{ inputs.username }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        STATS_OUT: ${{ inputs.output_dir }}
        CARDS: ${{ inputs.cards }}
      run: python3 "${{ github.action_path }}/generate_contrib_cards.py"
