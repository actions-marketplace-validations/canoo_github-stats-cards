# Copy this file to .github/workflows/stats.yml in your profile repo.
# It is an example only. It does not run in this repo.
name: Generate Stats Cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: canoo/github-stats-cards@v1.1.0
        with:
          # Pick only the cards you want. Leave this out for
          # stats and top-langs only, as in v1.0.0.
          cards: stats,top-langs,tetris,contrib-3d,snake,streak,summary
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit cards if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "Update stats cards"
          git push
