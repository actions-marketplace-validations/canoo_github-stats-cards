name: Test Action

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          output_dir: example
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit example cards if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add example
          git diff --cached --quiet || git commit -m "Update example cards"
          git push
